<?php
// customization_helper.php

if (session_status() === PHP_SESSION_NONE) {
    session_start();
}

// 1. Correctly move up one directory to include the root db_connect.php
require_once __DIR__ . '/../db_connect.php';

$settings = [];

// 2. Fetch the active salon profile tied to the logged-in user
if (isset($_SESSION['admin_id'])) {
    $adminId = $_SESSION['admin_id'];
    $settingsCollection = $db->settings;
    $settingsDocument = $settingsCollection->findOne([
        'type' => 'salon_profile',
        'admin_id' => $adminId
    ]);
    $settings = $settingsDocument ? (array) $settingsDocument : [];
}

// Dynamic fallbacks if MongoDB doesn't have the profile fields yet
$displaySalonName = !empty($settings['salon_name']) ? $settings['salon_name'] : 'DivaBook';
$colorPrimary = !empty($settings['color_primary']) ? $settings['color_primary'] : '#064E3B';
$colorSecondary = !empty($settings['color_secondary']) ? $settings['color_secondary'] : '#7cbf7f';
$logoPath = !empty($settings['logo_path']) ? $settings['logo_path'] : '';

// Dynamic CSS generator used across all pages
function getCustomStyles($colorPrimary, $colorSecondary)
{
    // Helper to convert hex to RGB components for opacity overlays
    $hex = str_replace('#', '', $colorPrimary);
    if (strlen($hex) == 3) {
        $r = hexdec(substr($hex, 0, 1) . substr($hex, 0, 1));
        $g = hexdec(substr($hex, 1, 1) . substr($hex, 1, 1));
        $b = hexdec(substr($hex, 2, 1) . substr($hex, 2, 1));
    } else {
        $r = hexdec(substr($hex, 0, 2));
        $g = hexdec(substr($hex, 2, 2));
        $b = hexdec(substr($hex, 4, 2));
    }
    $primaryRgb = "{$r}, {$g}, {$b}";

    return "
        :root {
            --primary-container: {$colorPrimary};
            --primary-rgb: {$primaryRgb};
            --on-primary-container: {$colorSecondary};
            --background: #faf9f6;
            --on-background: #1a1c1a;
            --outline-variant: #c0c9bc;
            --surface-container-low: #f4f4f0;
            --surface-container-lowest: #ffffff;
            --secondary-container: #cfe5d1;
            --on-secondary-container: #546757;
            --error: #ba1a1a;
            --warning: #eab308;
            --font-body: 'Manrope', sans-serif;
            --font-heading: 'Noto Serif', serif;
        }

        /* Global Theme Utilities override */
        .text-primary-theme { color: var(--primary-container) !important; }
        .bg-primary-theme { background-color: var(--primary-container) !important; }
        .btn-primary-theme { 
            background-color: var(--primary-container) !important; 
            color: white !important;
            border-color: var(--primary-container) !important;
        }
        .badge-primary-theme {
            background-color: var(--primary-container);
            color: white;
            border-radius: 4px;
        }
    ";
}
?>